name: guards

# The same checks the pre-commit hook runs, re-run where they cannot be
# skipped with --no-verify. The local hook is a convenience; this is the gate.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    name: OWNERS.yml drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: No drift between OWNERS.yml, agent definitions and routing
        # --offline: OpenProject runs on the developer's laptop and is not
        # reachable from CI. The board check runs pre-commit instead.
        run: uv run --with pyyaml python tools/op-cli/check_drift.py --offline

  routing:
    name: Path routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pyyaml python test_resolve.py
        working-directory: tools/op-cli

  boundaries:
    name: Agent boundaries (layer 3)
    runs-on: ubuntu-latest
    # PULL REQUESTS ONLY, and this is NOT the "skip when inconvenient" pattern
    # that made the layering job inert -- the distinction is worth being exact
    # about, because the two look identical from a distance.
    #
    # That job skipped when its own config was missing, so a misconfiguration
    # read as success. This one skips an event where the question is genuinely
    # unanswerable: GitHub authors a squash commit as the PR OPENER, and squash
    # flattens a branch into one message whose trailers git parses only from the
    # last paragraph. On `push: main` every commit therefore looks like it was
    # written by whoever clicked the button, and a multi-agent branch would
    # attribute every file to one agent. Running here would not be stricter, it
    # would be wrong -- and it would fail main for every agent-opened PR.
    #
    # The pull request is where the individual commits still exist, which is the
    # only place this can be answered honestly.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The range check walks every commit in the PR, so a shallow clone
          # would silently check a subset. 0 = full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: CODEOWNERS still matches OWNERS.yml
        run: uv run --with pyyaml python tools/op-cli/gen_codeowners.py --check
      - name: No commit wrote outside its agent boundary (ADR-0007, constitution 8)
        # This is the layer that survives --no-verify. The pre-commit hook is a
        # convenience on one laptop; ADR-0007 has claimed a third layer since it
        # was accepted and nothing implemented it, so PR #13 wrote to a
        # HUMAN-owned path with nothing to flag it.
        #
        # NOT YET BLOCKING. Ruleset 21628724 requires exactly three status
        # checks -- "OWNERS.yml drift", "Path routing", "Onion layers". This job
        # is not among them, so today it reports and a red run still merges.
        # Adding `Agent boundaries (layer 3)` to that ruleset is a repository
        # setting, not a file, so it cannot be done from here. Until someone
        # does it, this is evidence rather than a gate -- said plainly, because
        # a check that is believed to block and does not is worse than one
        # nobody trusts.
        #
        # Identity comes from the FW-Agent trailer, not from authorship: every
        # agent commits as one account, so authorship separates agent from human
        # and nothing finer. An agent commit with no trailer FAILS here rather
        # than passing -- otherwise dropping the trailer opts you out of the
        # check, which is the same hole as a guard that skips when misconfigured.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push to an unborn or force-updated ref gives an all-zero BASE.
          # Falling back to HEAD~1 keeps the job honest instead of having it
          # quietly check an empty range and report success.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse "$HEAD~1" 2>/dev/null || echo "$HEAD")"
          fi
          echo "range: $BASE..$HEAD"
          uv run --with pyyaml python tools/op-cli/check_boundaries.py --range "$BASE..$HEAD"

  layering:
    name: Onion layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependencies point inward (constitution 32, ADR-0016)
        # No conditional guard here, deliberately. This job used to skip when
        # `apps/api/app` was absent -- a directory that never existed, because
        # the package was guessed before any code did. It reported success for
        # its entire life while enforcing nothing.
        #
        # If the config is wrong, this must fail loudly rather than skip
        # quietly. A guard that cannot fail is not a guard.
        working-directory: apps/api
        run: uv run --with import-linter lint-imports --config ../../.importlinter

  constitution:
    name: Constitution (mechanical rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Rules a machine can settle without judgement
        # Added after review-agent found that this check's own docstring
        # claimed "they belong in CI where they cannot be skipped" while no
        # workflow ran it -- it existed only in a pre-commit hook that
        # --no-verify skips and scripts/setup never installs.
        #
        # Judgement calls are deliberately NOT here. They need a reader.
        run: uv run python tools/op-cli/check_constitution.py

  contracts:
    name: Contracts match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and diff (constitution 13)
        # No `if:` guard on the package existing. That conditional is how the
        # layering job spent its entire life reporting success while checking
        # nothing, and how check_drift printed "consistent across every
        # surface" having never looked at one of them. If the package is
        # missing, this job must go red.
        #
        # The env below is what Django needs to *load settings*, not to reach
        # a database. export_openapi_schema reads the routers through the app
        # registry and opens no socket, which is the whole reason the schema
        # comes from a file instead of a running server -- so no Postgres
        # service is needed here, and the DATABASE_URL is never connected to.
        env:
          DJANGO_SECRET_KEY: ci-only-never-used-to-sign-anything
          DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused
        run: |
          # `pnpm --filter <name>` exits 0 when the filter matches NOTHING.
          # Verified against pnpm 11.24.0: it prints "No projects matched the
          # filters" and returns success. So if the package name ever drifts
          # from the filter string, generation silently would not run, the
          # diff would be empty, and this step would print "Contracts match
          # the API" having generated nothing -- the exact failure the comment
          # above says this job exists to prevent, reintroduced by the command
          # used to prevent it. Found by review, not by inspection.
          #
          # `--dir` fails loudly on a missing directory, and `pnpm run` fails
          # on a missing script.
          pnpm --dir packages/contracts run generate

          # Positive assertion, independent of how generation was invoked. A
          # gate that only checks "nothing changed" cannot tell success from
          # a no-op, and every silent guard in this repo has been exactly
          # that shape.
          for f in packages/contracts/openapi.json packages/contracts/src/index.ts                    packages/contracts/src/types.gen.ts packages/contracts/src/sdk.gen.ts; do
            test -s "$f" || { echo "::error::$f missing or empty after generation"; exit 1; }
          done

          # `git diff --exit-code` alone is not enough: it compares tracked
          # files and says nothing about a *new* file the generator emitted.
          # Staging first makes additions and deletions visible too, so a new
          # endpoint that nobody regenerated fails here rather than arriving
          # as a 404 on a television.
          git add --all -- packages/contracts
          if ! git diff --cached --quiet -- packages/contracts; then
            echo "::error::packages/contracts is out of date. Run: pnpm --dir packages/contracts run generate"
            git diff --cached --stat -- packages/contracts
            git diff --cached -- packages/contracts | head -200
            exit 1
          fi
          echo "Contracts match the API."

      - name: The generated client typechecks
        # `typecheck` existed in package.json and no workflow ran it, which is
        # the same "declared but never executed" shape as the rest.
        run: pnpm --dir packages/contracts run typecheck
