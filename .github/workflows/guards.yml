name: guards

# The same checks the pre-commit hook runs, re-run where they cannot be
# skipped with --no-verify. The local hook is a convenience; this is the gate.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    name: OWNERS.yml drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: No drift between OWNERS.yml, agent definitions and routing
        # --offline: OpenProject runs on the developer's laptop and is not
        # reachable from CI. The board check runs pre-commit instead.
        run: uv run --with pyyaml python tools/op-cli/check_drift.py --offline

  routing:
    name: Path routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pyyaml python test_resolve.py
        working-directory: tools/op-cli

  layering:
    name: Onion layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependencies point inward (constitution 32, ADR-0016)
        # No conditional guard here, deliberately. This job used to skip when
        # `apps/api/app` was absent -- a directory that never existed, because
        # the package was guessed before any code did. It reported success for
        # its entire life while enforcing nothing.
        #
        # If the config is wrong, this must fail loudly rather than skip
        # quietly. A guard that cannot fail is not a guard.
        working-directory: apps/api
        run: uv run --with import-linter lint-imports --config ../../.importlinter

  constitution:
    name: Constitution (mechanical rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Rules a machine can settle without judgement
        # Added after review-agent found that this check's own docstring
        # claimed "they belong in CI where they cannot be skipped" while no
        # workflow ran it -- it existed only in a pre-commit hook that
        # --no-verify skips and scripts/setup never installs.
        #
        # Judgement calls are deliberately NOT here. They need a reader.
        run: uv run python tools/op-cli/check_constitution.py

  contracts:
    name: Contracts match the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and diff (constitution 13)
        # No `if:` guard on the package existing. That conditional is how the
        # layering job spent its entire life reporting success while checking
        # nothing, and how check_drift printed "consistent across every
        # surface" having never looked at one of them. If the package is
        # missing, this job must go red.
        #
        # The env below is what Django needs to *load settings*, not to reach
        # a database. export_openapi_schema reads the routers through the app
        # registry and opens no socket, which is the whole reason the schema
        # comes from a file instead of a running server -- so no Postgres
        # service is needed here, and the DATABASE_URL is never connected to.
        env:
          DJANGO_SECRET_KEY: ci-only-never-used-to-sign-anything
          DATABASE_URL: postgres://unused:unused@127.0.0.1:1/unused
        run: |
          pnpm --filter @fun-world/contracts generate

          # `git diff --exit-code` alone is not enough: it compares tracked
          # files and says nothing about a *new* file the generator emitted.
          # Staging first makes additions and deletions visible too, so a new
          # endpoint that nobody regenerated fails here rather than arriving
          # as a 404 on a television.
          git add --all -- packages/contracts
          if ! git diff --cached --quiet -- packages/contracts; then
            echo "::error::packages/contracts is out of date. Run: pnpm --filter @fun-world/contracts generate"
            git diff --cached --stat -- packages/contracts
            git diff --cached -- packages/contracts | head -200
            exit 1
          fi
          echo "Contracts match the API."
