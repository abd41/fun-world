name: guards

# The same checks the pre-commit hook runs, re-run where they cannot be
# skipped with --no-verify. The local hook is a convenience; this is the gate.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  drift:
    name: OWNERS.yml drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: No drift between OWNERS.yml, agent definitions and routing
        # --offline: OpenProject runs on the developer's laptop and is not
        # reachable from CI. The board check runs pre-commit instead.
        run: uv run --with pyyaml python tools/op-cli/check_drift.py --offline

  routing:
    name: Path routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --with pyyaml python test_resolve.py
        working-directory: tools/op-cli

  layering:
    name: Onion layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Dependencies point inward (constitution 32, ADR-0016)
        # No conditional guard here, deliberately. This job used to skip when
        # `apps/api/app` was absent -- a directory that never existed, because
        # the package was guessed before any code did. It reported success for
        # its entire life while enforcing nothing.
        #
        # If the config is wrong, this must fail loudly rather than skip
        # quietly. A guard that cannot fail is not a guard.
        working-directory: apps/api
        run: uv run --with import-linter lint-imports --config ../../.importlinter

  constitution:
    name: Constitution (mechanical rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Rules a machine can settle without judgement
        # Added after review-agent found that this check's own docstring
        # claimed "they belong in CI where they cannot be skipped" while no
        # workflow ran it -- it existed only in a pre-commit hook that
        # --no-verify skips and scripts/setup never installs.
        #
        # Judgement calls are deliberately NOT here. They need a reader.
        run: uv run python tools/op-cli/check_constitution.py
